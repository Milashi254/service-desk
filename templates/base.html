<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Public Service Desk{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    form input:not([type=checkbox]):not([type=file]), form select, form textarea {
      display: block; width: 100%; padding: .5rem .75rem;
      border: 1px solid #ced4da; border-radius: .375rem;
    }
    form p { margin-bottom: 1rem; }
    .helptext { font-size: .85rem; color: #6c757d; }
    .errorlist { color: #b02a37; list-style: none; padding-left: 0; font-size: .9rem; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-success mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Public Service Desk</a>
      <div class="d-flex gap-2 align-items-center">
        {% if user.is_authenticated %}
          <span class="text-white small">Hi, {{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-light">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-sm btn-light" href="{% url 'login' %}">Log in</a>
          <a class="btn btn-sm btn-outline-light" href="{% url 'register' %}">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container pb-5" style="max-width: 720px;">
    {% for message in messages %}
      <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
