{% extends 'base.html' %}
{% block title %}New request{% endblock %}
{% block content %}
  <div class="card p-4">
    <h1 class="h4 mb-3">Submit a service request</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100">Submit request</button>
    </form>
  </div>
{% endblock %}
