{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
  <div class="card p-4">
    <h1 class="h4 mb-3">Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100">Log in</button>
    </form>
        <p class="small text-muted mb-2">Forgot your password? Please contact the service desk administrator to have it reset.</p>
    <p class="mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
  </div>
{% endblock %}
